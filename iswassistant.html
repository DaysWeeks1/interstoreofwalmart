<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zenze Compact - ISW Mobile Assistant</title>
    <style>
        :root {
            --primary-purple: #5c2d91;
            --accent-blue: #0071ce;
            --walmart-yellow: #ffc220;
            --bg-light-blue: #e0f2fe; /* Light blue background */
            --text-dark: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .chat-container {
                height: 620px;
                border-radius: 18px;
                box-shadow: 0 10px 30px rgba(0, 113, 206, 0.15);
                border: 2px solid var(--primary-purple);
            }
        }

        /* Header Styling */
        .chat-header {
            background: linear-gradient(135deg, var(--primary-purple), var(--accent-blue));
            color: #ffffff;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--walmart-yellow);
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .chat-header span {
            font-size: 0.75rem;
            background-color: var(--walmart-yellow);
            color: var(--text-dark);
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Chat Log Window */
        .chat-log {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
            background-color: #f8fafc;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-wrap: break-word;
        }

        .message.bot {
            background-color: #ffffff;
            color: var(--text-dark);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 4px solid var(--accent-blue);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .message.bot a {
            color: var(--accent-blue);
            font-weight: bold;
            text-decoration: underline;
        }

        .message.user {
            background-color: var(--primary-purple);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Mobile Input Area */
        .chat-input-area {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            height: 48px;
            padding: 0 16px;
            border: 2px solid #cbd5e1;
            border-radius: 24px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-blue);
        }

        .chat-input-area button {
            height: 48px;
            background-color: var(--walmart-yellow);
            color: var(--text-dark);
            border: none;
            padding: 0 20px;
            border-radius: 24px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .chat-input-area button:active {
            background-color: #e5ac1c;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Zenze Compact</h1>
            <span>ISW Assistant</span>
        </div>

        <div class="chat-log" id="chatLog">
            <div class="message bot">
                Hello! I am Zenze Compact, your assistant for the International Store of Walmart. How can I help you today?
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask a question..." autocomplete="off" onkeydown="handleKeyPress(event)" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // Expanded knowledge base with flexible keyword rules
        const knowledgeBase = [
            {
                keywords: ["newsletter", "experience", "experiences", "find", "where"],
                requireAny: ["experience", "experiences"],
                answer: "You can find your Newsletter Experiences by clicking the Newsletter Experiences & Feedback and clicking on the date that you recieved your newsletter."
            },
            {
                keywords: ["unsubscribe", "newsletter", "stop", "cancel"],
                requireAny: ["unsubscribe"],
                answer: "You can press the Unsubscribe from the Newsletter button, then complete the form to successfully unsubscribe."
            },
            {
                keywords: ["order", "food", "buy", "eat", "hungry"],
                requireAny: ["food"],
                answer: "You can order food by pressing the Order Food button. Disclaimer: The food is virtual 😉"
            },
            {
                keywords: ["card", "apply", "signup", "sign", "get", "register"],
                requireAny: ["card"],
                answer: "You can apply for an ISW Card by clicking the ISW Card button and filling out the form."
            },
            {
                keywords: ["legal", "action", "lawsuit", "court", "sued", "lawyer"],
                requireAny: ["legal"],
                answer: "If you have encountered legal action, you can press the Legal Action button, then choose what has happened in the list of buttons."
            },
            {
                keywords: ["media", "access", "use", "login", "signin", "sign"],
                requireAny: ["media"],
                answer: "To access ISW Media, you can simply click the button that says ISW Media and sign in. To request an account, please email interstoreofwalmart@icloud.com."
            }
        ];

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const rawText = inputField.value.trim();

            if (rawText === "") return;

            appendMessage(rawText, 'user');
            inputField.value = '';

            const botResponse = getBotResponse(rawText);

            setTimeout(() => {
                appendMessage(botResponse, 'bot', true);
            }, 300);
        }

        function getBotResponse(userInput) {
            const cleanedInput = userInput.toLowerCase().replace(/[^\w\s]/gi, '');

            for (const item of knowledgeBase) {
                // Check if key anchor terms are present
                const hasAnchor = item.requireAny.some(req => cleanedInput.includes(req));
                const matchCount = item.keywords.filter(keyword => cleanedInput.includes(keyword)).length;

                if (hasAnchor || matchCount >= 2) {
                    return item.answer;
                }
            }

            // Fallback response with concise Google result link format
            const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(userInput)}`;
            return `I didn’t get that. Can you try rephrasing your question? I haven’t gotten that advanced yet. If that was a general question, here is the Google result: <a href="${googleSearchUrl}" target="_blank" rel="noopener">Search Google for "${userInput}"</a>`;
        }

        function appendMessage(text, sender, isHTML = false) {
            const chatLog = document.getElementById('chatLog');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            if (isHTML) {
                messageDiv.innerHTML = text;
            } else {
                messageDiv.textContent = text;
            }

            chatLog.appendChild(messageDiv);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>
</html>
