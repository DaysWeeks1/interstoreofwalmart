<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISW - Identity Verification</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
  <style>
    :root {
      --isw-blue: #0071dc;
      --isw-dark-blue: #004f9a;
      --isw-yellow: #ffc220;
      --isw-yellow-hover: #e0a800;
      --bg-gray: #f4f6f8;
      --error-red: #d93025;
      --success-green: #188038;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-gray);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--isw-blue);
      color: white;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--isw-yellow);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      background-color: var(--isw-yellow);
      color: #000;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.25rem 1rem;
    }

    .verification-card {
      background: white;
      padding: 2rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 440px;
      border-top: 5px solid var(--isw-blue);
    }

    .card-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .card-header h2 {
      color: var(--isw-blue);
      font-size: 1.5rem;
      margin-bottom: 0.4rem;
    }

    .card-header p {
      color: #666;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-weight: 600;
      color: #444;
      font-size: 0.85rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--isw-blue);
      box-shadow: 0 0 0 3px rgba(0, 113, 220, 0.15);
    }

    .status-msg {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      display: none;
      text-align: center;
      font-weight: 600;
    }

    .status-msg.error {
      display: block;
      background-color: #fce8e6;
      color: var(--error-red);
      border: 1px solid #fad2cf;
    }

    .status-msg.success {
      display: block;
      background-color: #e6f4ea;
      color: var(--success-green);
      border: 1px solid #ceead6;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--isw-yellow);
      color: #000;
      border: none;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 0.5rem;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-submit:hover {
      background-color: var(--isw-yellow-hover);
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    @media (max-width: 480px) {
      .verification-card {
        padding: 1.5rem 1.25rem;
      }
      .card-header h2 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <h1>ISW</h1>
      <span class="logo-badge">Walmart Global</span>
    </div>
  </header>

  <main>
    <div class="verification-card">
      <div class="card-header">
        <h2>Identity Verification</h2>
        <p>Please enter your credentials to verify your account access.</p>
      </div>

      <div id="status-msg" class="status-msg"></div>

      <form id="verification-form" autocomplete="off">
        <div class="form-group">
          <label for="user-name">Full Name</label>
          <input type="text" id="user-name" placeholder="e.g. Jane Doe" required>
        </div>

        <div class="form-group">
          <label for="user-email">Email Address</label>
          <input type="email" id="user-email" placeholder="e.g. name@example.com" required>
        </div>

        <div class="form-group">
          <label for="ceo-name">Name of CEO of ISW</label>
          <input type="text" id="ceo-name" placeholder="Enter CEO's full name" required>
        </div>

        <button type="submit" class="btn-submit">Verify & Sign In</button>
      </form>
    </div>
  </main>

<script>
    // Nice try
    const SECURE_KEYS = {
      name: "c29waGlhIGlzYWFr",
      email: "c29waGlhLmlzYWFrQGljbG91ZC5jb20=",
      ceo: "ZGF2aWQgZ2ltcGVsZXZpY2g="
    };

    const form = document.getElementById('verification-form');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      // Clean input (lowercase and remove extra whitespace)
      const nameInput = document.getElementById('user-name').value.toLowerCase().trim();
      const emailInput = document.getElementById('user-email').value.toLowerCase().trim();
      const ceoInput = document.getElementById('ceo-name').value.toLowerCase().trim();

      // Encode inputs to something using something()
      const encodedName = btoa(nameInput);
      const encodedEmail = btoa(emailInput);
      const encodedCeo = btoa(ceoInput);

      // Verify each field
      const isNameValid = encodedName === SECURE_KEYS.name;
      const isEmailValid = encodedEmail === SECURE_KEYS.email;
      const isCeoValid = encodedCeo === SECURE_KEYS.ceo;

      if (isNameValid && isEmailValid && isCeoValid) {
        statusMsg.className = 'status-msg success';
        statusMsg.textContent = 'Identity Verified Successfully! Access Granted.';
      } else {
        statusMsg.className = 'status-msg error';
        statusMsg.textContent = 'Verification failed. Incorrect details provided.';
      }
    });
  </script>
</body>
</html>
